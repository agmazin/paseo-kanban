<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Канбан для Paseo - живой макет</title>
<style>

:root{--page:#0d0d0e;--win:#1b1b1b;--side:#181818;--line:#2a2a2a;--hover:#222;--active:#2b2b2b;--fg:#ececec;--fg2:#a6a6a6;--fg3:#6f6f6f;--run:#5caaf6;--ok:#35c264;--warn:#db932e;--bad:#f7796d;--card:#212121;--card2:#262626}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--fg);font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.shot{padding:28px;display:inline-block}
.cap{font-size:15px;font-weight:600;margin:0 0 12px;color:var(--fg2)}
.window{position:relative;width:1440px;height:900px;background:var(--win);border:1px solid #2c2c2c;border-radius:12px;overflow:hidden;display:flex;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.ico{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.logo{width:16px;height:16px;fill:currentColor;flex:0 0 16px}
/* sidebar */
.side{width:300px;flex:0 0 300px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}
.side-top{height:44px;display:flex;align-items:center;gap:16px;padding:0 14px;color:var(--fg2)}
.lights{display:flex;gap:8px}.lights i{width:12px;height:12px;border-radius:50%;background:#3a3a3a;display:block}
.side-scroll{flex:1;overflow:hidden;padding:2px 0 10px}
.row{--cut:var(--side);display:flex;align-items:center;gap:10px;height:34px;margin:0 8px;padding:0 10px;border-radius:9px;color:var(--fg);white-space:nowrap}
.row.sel{--cut:var(--active);background:var(--active)}
.row .ico{color:var(--fg2)}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.label{display:flex;align-items:center;justify-content:space-between;height:30px;margin:2px 8px 0;padding:0 10px;color:var(--fg2);font-size:13px}
.label .ico{width:15px;height:15px;color:var(--fg3)}
.plugin{margin:8px 6px 4px;padding:0 0 6px;border-radius:12px;background:#1c1c1c}
.plugin .row{margin:0 2px}.plugin .label{margin:0 2px;padding-right:6px}
.grp .name{font-weight:500}
.chev{width:14px;height:14px;color:var(--fg3);stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 14px}
.chev.open{transform:rotate(90deg)}
.sum{margin-left:auto;color:var(--fg3);font-size:12px;font-variant-numeric:tabular-nums}
.agent{height:30px;padding-left:30px;font-size:13.5px}
.agent .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:#dcdcdc}
.time{color:var(--fg3);font-size:12px;font-variant-numeric:tabular-nums}
.arch{height:30px;padding-left:30px;color:var(--fg2);font-size:13.5px}.arch .ttl{flex:1}
.pv{position:relative;width:16px;height:16px;flex:0 0 16px;color:var(--fg2)}
.bd{position:absolute;border-radius:50%;box-shadow:0 0 0 1.6px var(--cut,var(--side))}
.bd-run,.bd-att{width:7px;height:7px;right:-2px;bottom:-2px}
.bd-run{background:var(--run)}
.bd-run::after{content:"";position:absolute;inset:-3.5px;border-radius:50%;border:1.5px solid rgba(92,170,246,.2);border-top-color:var(--run);transform:rotate(40deg)}
.bd-att{background:var(--ok)}
.bd-need{width:12px;height:12px;right:-4px;bottom:-4px;background:var(--warn);color:#1b1b1b;font:800 9px/12px -apple-system,system-ui,sans-serif;text-align:center}
.side-foot{height:46px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:var(--fg2)}
.side-foot span{display:flex;gap:16px}
/* main */
.main{position:relative;flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:44px;display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--fg)}
.topbar .muted{color:var(--fg2)}.topbar .ico{color:var(--fg2)}
.topbar .sp{flex:1}
.hbtn{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:8px;background:#232323;border:1px solid #2e2e2e;color:var(--fg);font-size:13px}
.hbtn .ico{width:15px;height:15px;color:var(--fg2)}
.hbtn .n{background:var(--warn);color:#1b1b1b;font-weight:700;font-size:11px;border-radius:999px;padding:0 6px;line-height:16px}
.tabs{height:42px;display:flex;align-items:center;gap:2px;padding:0 10px;border-bottom:1px solid var(--line)}
.tab{--cut:var(--win);display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:8px;color:var(--fg2);font-size:13px;white-space:nowrap}
.tab.on{--cut:#262626;background:#262626;color:var(--fg)}
.tab .ico{width:15px;height:15px}
.tab.plus{padding:0 8px}
.tabs .sp{flex:1}
.body{flex:1;min-height:0;display:flex}
.pane{flex:1;min-width:0;display:flex;flex-direction:column}
/* chat */
.chat{flex:1;overflow:hidden;padding:26px 56px 18px;display:flex;flex-direction:column;gap:16px;font-size:14px;line-height:1.5}
.msg{color:#e2e2e2;max-width:760px}
.me{align-self:flex-end;background:#2a2a2a;border-radius:14px;padding:10px 16px;color:var(--fg)}
.tool{display:flex;align-items:center;gap:10px;color:var(--fg2);font-size:13px}
.tool .ico{width:15px;height:15px}
.meta{display:flex;align-items:center;gap:14px;color:var(--fg3);font-size:12.5px}
.meta .ico{width:15px;height:15px}
.trow{display:flex;align-items:flex-start;gap:10px;background:#1f2328;border:1px solid #2b3a4a;border-radius:10px;padding:9px 12px;font-size:13px;color:var(--fg);max-width:760px}
.trow .ico{color:var(--run);width:16px;height:16px;margin-top:2px}.trow .s{margin-top:2px}
.trow .s{color:var(--fg2)}
.composer{margin:0 40px 0;border:1px solid #2e2e2e;border-radius:14px;padding:13px 16px 11px;background:#1e1e1e}
.composer .ph{color:var(--fg3);font-size:13.5px}
.cbar{display:flex;gap:16px;margin-top:16px;color:var(--fg2);font-size:13px;align-items:center}
.cbar span{display:inline-flex;gap:6px;align-items:center}.cbar .sp{flex:1}
.cbar .ico{width:15px;height:15px}
/* limits strip (paseo-limits 0.1.4, medium) */
.lim{display:flex;align-items:center;gap:14px;height:20px;margin:12px 40px 12px;padding:0 6px;font:13px/20px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--fg2);white-space:nowrap}
.lim .rf{width:15px;height:15px;color:#5b5b5b;margin:0 -2px 0 -0px}
.lim .lg{color:#c9c9c9;display:inline-flex}
.lim .win{display:inline-flex;align-items:center;gap:6px}
.lim .bar{width:56px;height:6px;border-radius:3px;background:#2a2a2a;overflow:hidden;display:inline-block}
.lim .bar i{display:block;height:100%;background:#3f8f6a}
.lim .bar i.w{background:#c98a2e}
.lim .pct{color:var(--fg)}.lim .pct.w{color:#e2a64a}
.lim .left{color:#5b5b5b}
.lim .vsep{width:1px;height:16px;background:var(--line)}
/* board */
.board{flex:1;min-width:0;min-height:0;padding:22px 26px 0;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.bhead{display:flex;align-items:baseline;gap:12px}
.bhead h2{margin:0;font-size:19px;font-weight:600}
.bhead .s{color:var(--fg2);font-size:13px}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.col{background:#191919;border:1px solid #242424;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.colh{display:flex;align-items:center;gap:8px;padding:2px 4px 4px;font-size:13px;color:var(--fg2);font-weight:500}
.colh .n{color:var(--fg3);font-variant-numeric:tabular-nums}
.colh .dot{width:8px;height:8px;border-radius:50%}
.kc{--cut:var(--card);background:var(--card);border:1px solid #2c2c2c;border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:6px}
.kc .t{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;font-weight:600;line-height:1.35;color:var(--fg)}
.kc .t span{flex:1}
.kc .now{font-size:12.5px;color:var(--fg2);line-height:1.4}
.kc .need{font-size:12.5px;line-height:1.4;color:#f0c27a;background:rgba(219,147,46,.1);border:1px solid rgba(219,147,46,.32);border-radius:8px;padding:6px 8px}
.kc .ft{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--fg3);margin-top:2px}
.kc .ft .who{min-width:0;color:#cfcfcf;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc .ft .sp{flex:1}
.kc .ft .logo{width:14px;height:14px;color:#cfcfcf;flex-basis:14px}
.kc.new{box-shadow:0 0 0 1.5px var(--run),0 0 24px rgba(92,170,246,.25)}
.mini{position:relative;display:inline-block;width:8px;height:8px;border-radius:50%;flex:0 0 auto;margin-top:5px}
.m-run{background:var(--run)}
.m-run::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.4px solid rgba(92,170,246,.2);border-top-color:var(--run);transform:rotate(40deg)}
.m-att{background:var(--ok)}
.m-need{width:13px;height:13px;margin-top:2px;background:var(--warn);color:#1b1b1b;font:800 9.5px/13px -apple-system,system-ui,sans-serif;text-align:center}
.m-q{background:#4a4a4a}
.archrow{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:9px;color:var(--fg2);font-size:13.5px;background:#191919;border:1px solid #242424}
.archrow .sp{flex:1}
.archrow .n{color:var(--fg3);font-size:12.5px}
/* explorer (right panel) */
.exp{width:380px;flex:0 0 380px;border-left:1px solid var(--line);background:#191919;display:flex;flex-direction:column}
.exph{height:42px;display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--line)}
.exph .tab{height:28px}
.exph .sp{flex:1}
.expb{flex:1;overflow:hidden;padding:14px 14px;display:flex;flex-direction:column;gap:10px}
.sec .mini{margin-top:0}.sec{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg2);font-weight:500;padding:4px 2px 0}
.sec .n{color:var(--fg3)}
.ptitle{display:flex;align-items:baseline;gap:8px;padding:0 2px}
.ptitle b{font-size:15px}
.ptitle span{color:var(--fg3);font-size:12.5px}
/* overlay card */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
.big{width:620px;background:#1f1f1f;border:1px solid #333;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6);padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.big .top{display:flex;align-items:center;gap:10px;color:var(--fg2);font-size:13px}
.big .top .sp{flex:1}
.status{display:inline-flex;align-items:center;gap:7px;background:#262626;border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;color:var(--fg)}
.big h3{margin:0;font-size:21px;font-weight:600;line-height:1.3}
.fld .k{font-size:12px;color:var(--fg3);margin-bottom:5px;text-transform:none}
.fld .v{font-size:14.5px;color:#e4e4e4;line-height:1.5}
.big .need{font-size:14px;line-height:1.5;color:#f3c98a;background:rgba(219,147,46,.1);border:1px solid rgba(219,147,46,.35);border-radius:10px;padding:10px 12px}
.reply{display:flex;gap:8px}
.reply .in{flex:1;background:#171717;border:1px solid #3a3a3a;border-radius:9px;padding:9px 12px;color:var(--fg3);font-size:13.5px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid #363636;background:#262626;color:var(--fg);padding:8px 13px;border-radius:9px;font-size:13.5px}
.btn.pri{background:#2f6db0;border-color:#3b7cc4}
.btn .ico{width:15px;height:15px}
.whobox{display:flex;align-items:center;gap:12px;background:#181818;border:1px solid #2c2c2c;border-radius:12px;padding:12px 14px}
.whobox .pv{color:#d6d6d6}
.whobox .w1{font-size:14px;color:var(--fg)}
.whobox .w2{font-size:12.5px;color:var(--fg3);margin-top:2px}
.whobox .sp{flex:1}
/* readings */
.rd{display:grid;grid-template-columns:1fr 1fr;gap:22px;width:1440px}
.rbox{background:#161616;border:1px solid #2a2a2a;border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.rbox h3{margin:0;font-size:18px}
.rbox .sub{color:var(--fg2);font-size:13.5px;line-height:1.5}
.rbox.rec{border-color:#2f5b86;box-shadow:0 0 0 1px rgba(92,170,246,.25)}
.badge{display:inline-block;font-size:12px;background:rgba(92,170,246,.15);color:#8cc3fa;border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:middle;font-weight:500}
.flow{display:flex;gap:14px;align-items:stretch}
.chatbox{flex:0 0 220px;background:#1d1d1d;border:1px solid #303030;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.chatbox .h{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.chatbox .l{height:8px;border-radius:5px;background:#2a2a2a}
.chatbox .l.s{width:60%}
.arrow{align-self:center;color:var(--fg3);font-size:22px}
.stack{flex:1;display:flex;flex-direction:column;gap:8px}
.stack .kc{padding:9px 11px}
.sub2{display:flex;align-items:center;gap:7px;font-size:12px;color:#cfcfcf;background:#1a1a1a;border:1px dashed #3a3a3a;border-radius:8px;padding:5px 8px}
.sub2 .logo{width:13px;height:13px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;line-height:1.5}
.pc div b{display:block;font-size:12px;color:var(--fg3);font-weight:500;margin-bottom:3px}
.pc ul{margin:0;padding-left:16px;color:#d6d6d6}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.panelbox{background:var(--win);border:1px solid #2c2c2c;border-radius:12px;overflow:hidden;width:620px}
.panelbox .bh{height:40px;display:flex;align-items:center;padding:0 14px;color:var(--fg2);font-size:13px;border-bottom:1px solid var(--line)}
.panelbox .bb{padding:14px;display:flex;flex-direction:column;gap:8px}
.ar{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;font-size:13.5px;color:#dcdcdc}
.ar.sub{padding-left:34px;height:30px;font-size:13px;color:var(--fg2)}
.ar .sp{flex:1}
.ar .t2{color:var(--fg3);font-size:12px}
.ar .logo{color:#bdbdbd}
.ar .pill2{font-size:11.5px;color:var(--fg2);background:#262626;border-radius:999px;padding:1px 8px}
.ar.more{color:var(--run);font-size:12.5px;padding-left:34px}

.m-acc{width:13px;height:13px;margin-top:2px;background:#a78bfa;color:#1b1b1b;font:800 9px/13px -apple-system,system-ui,sans-serif;text-align:center}
.kc.acc{border-color:rgba(167,139,250,.5);background:#221f2b}
.accbox{display:flex;flex-direction:column;gap:7px;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.35);border-radius:8px;padding:7px 8px}
.accbox .h{font-size:12.5px;color:#cdbcff;font-weight:600}
.accbox .w{font-size:12px;color:#b8b0d0}
.accbtns{display:flex;gap:6px}
.accbtns span{flex:1;text-align:center;font-size:12.5px;border-radius:7px;padding:5px 0;cursor:pointer}
.accbtns .ok{background:#2e6b4a;color:#fff}.accbtns .back{background:#2a2a2a;color:var(--fg);border:1px solid #3a3a3a}
.selfchk{display:inline-block;font-size:11px;color:var(--fg2);background:#2a2a2a;border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.hbtn .n2{background:#a78bfa;color:#1b1b1b;font-weight:700;font-size:11px;border-radius:999px;padding:0 6px;line-height:16px}
.big .acc{font-size:14px;line-height:1.5;color:#ddd2ff;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.38);border-radius:10px;padding:10px 12px}
.big .acc ul{margin:6px 0 0;padding-left:18px;color:#c9c0e6}
.cols5{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:12px!important}
.board2{position:relative;flex:1;min-width:0;overflow:auto;padding:16px 22px 24px}
.bh2{display:flex;align-items:center;gap:6px;margin-bottom:10px}.bh2 h2{margin:0;font-size:18px;font-weight:600}.bh2 .sp{flex:1}
.tb{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg2);cursor:pointer}.tb:hover,.tb.on{background:#262626;color:var(--fg)}
.cols2{display:grid;gap:18px;align-items:start}
.ch2{display:flex;align-items:baseline;gap:8px;font-size:14.5px;font-weight:600;color:var(--fg);padding:4px 2px 8px}.ch2 .n,.gh2 .n{color:var(--fg3);font-weight:400;font-size:12.5px}
.gh2{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#d0d0d0;padding:7px 2px 6px;cursor:pointer;user-select:none}
.gh2 .logo{width:14px;height:14px;color:#bdbdbd}.gh2 .ico{width:15px;height:15px;color:var(--fg3)}
.kc2{position:relative;background:#232323;border:1px solid #2d2d2d;border-radius:9px;padding:8px 32px 8px 11px;margin-bottom:6px;cursor:pointer}
.kc2:hover{background:#272727}.kc2 .t2{font-size:13.5px;line-height:1.35;color:var(--fg)}
.kc2 .m2,.m2{font-size:11.5px;color:var(--fg3);margin-top:3px}
.kc2 .av{position:absolute;right:10px;top:9px;color:#9e9e9e;display:inline-flex}.kc2 .av .logo{width:14px;height:14px}
.kc2 .d2{font-size:12px;color:var(--fg2);margin-top:5px;line-height:1.4}
.kc2.done .t2{color:var(--fg3)}.kc2.drag{opacity:.4}.kc2.over{box-shadow:0 -2px 0 0 var(--run)}
.archwrap{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
.gh2.sub{padding-left:22px;font-weight:500}.archt{font-size:13px;color:var(--fg3);padding:4px 2px 4px 44px}
.pop{position:absolute;z-index:30;background:#232323;border:1px solid #343434;border-radius:12px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.55);min-width:260px}
.plabel{color:var(--fg3);font-size:12.5px;padding:6px 10px 4px}
.pi{display:flex;align-items:center;gap:12px;height:38px;padding:0 10px;border-radius:8px;font-size:14px;color:var(--fg);cursor:pointer;white-space:nowrap}.pi:hover{background:#2c2c2c}
.pi .v{margin-left:auto;color:var(--fg2);font-size:13px;display:inline-flex;align-items:center;gap:4px}.pi .v .ico{width:13px;height:13px}
.pi.sel{color:#6d9df5}.pi .ck{margin-left:auto;color:#6d9df5;display:inline-flex}.pi .ck .ico{width:16px;height:16px}
.big .top{font-size:13px}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-right:2px}
.kc2{padding:8px 11px 9px!important}
.kc2 .top2{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--fg3);margin-bottom:3px}
.kc2 .top2 .st2{margin-left:auto;display:inline-flex;align-items:center;gap:5px}
.kc2 .own{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12.5px;color:#c4c4c4;font-weight:500}
.kc2 .own .logo{width:14px;height:14px;flex-basis:14px;color:#c9c9c9}
.kc2 .exe{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:11.5px;color:var(--fg3)}
.kc2 .exe .ico{width:13px;height:13px;color:#555}
.kc2 .exe .logo{width:12px;height:12px;flex-basis:12px;color:#8d8d8d}
.kc2 .exe .en{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kc2 .own span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc2.done .own{color:var(--fg3)}
.ch2 .sdot{align-self:center}
.board2{display:flex;flex-direction:column;overflow:hidden!important;padding:16px 0 0 22px!important}
.board2 .bh2{padding-right:22px}

.pills{display:flex;gap:8px;margin:0 40px 8px;flex-wrap:wrap}
.pill3{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;border:1px solid #333;background:#202020;font-size:13px;color:var(--fg2);white-space:nowrap}

.qrow .tx{flex:1;min-width:0}
.qb{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#2a2a2a;color:var(--fg2);cursor:pointer;flex:0 0 34px}
.qb.go{background:#2f7a4f;color:#fff}.qb .ico{width:16px;height:16px}
.cin{width:100%;background:transparent;border:0;outline:none;color:var(--fg);font:inherit;font-size:13.5px;padding:0}
.cin::placeholder{color:var(--fg3)}
.sendb{width:34px;height:34px;border-radius:50%;background:#2f7a4f;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.stopb{width:34px;height:34px;border-radius:50%;background:#e04b4b;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.stopb i{width:12px;height:12px;background:#fff;border-radius:2px;display:block}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid #444;border-top-color:#bbb;display:inline-block}
.subhead{display:flex;align-items:center;gap:8px;color:var(--fg3);font-size:12.5px}
.subhead .logo{width:13px;height:13px;color:#9e9e9e}
.pi.hl{background:#2c2c2c}.gh2.archg{color:var(--fg3)}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 28px 0;color:var(--fg2);font-size:13px}
.ctl .btn{cursor:pointer}

.tab[data-go]:hover{background:#222}

  const subs = (ST.openSubs||[]).map(id => { const x = TASKS.find(t => t.id === id); return x ? t('sub:' + id, ic('corner') + pv(x.ep||'claude', x.col==='run'?'run':x.col==='need'?'need':x.col==='acc'?'att':'') + x.exec) : ''; }).join('');
  return `<div class="tabs">${t('kan', ic('kan') + 'Канбан')}${t('Дебиторка', pv('claude','run') + 'Дебиторка')}${t('Общий ИИ', pv('claude','att') + 'Общий ИИ')}${t('Тендер', pv('claude','') + 'Тендер')}${subs}<div class="tab plus">${ic('plus')}</div><span class="sp"></span>${ic('dots')}</div>`;
}
const CHATS = {
  'Дебиторка': `<div class="msg">Сверил вид виджета с оригиналом AMGROUP по снимкам: шапка, итог и кнопки совпадают. Осталось поле "Просрочено" - для него нужен ответ, какие этапы считать просроченными.</div><div class="meta">${ic('copy')}${ic('branch')}<span>Время работы: 6m 10s</span></div>`,
  'Общий ИИ': `<div class="msg">Отчёт по звонкам за октябрь собран: 412 звонков, 38 без ответа, разбивка по менеджерам. Файл лежит в outbox, отправлю после твоего "лей".</div><div class="meta">${ic('copy')}${ic('branch')}<span>Время работы: 2m 41s</span></div>`,
};
function chatL(chat) {
  if (chat === 'Тендер') return chatTender(ST.auto).replace(/<div class="trow">[\s\S]*?<\/div><\/div><\/div>/, `<div class="tool">${ic('kan')}Канбан: новая карточка "Срок подачи тендера в задачу менеджеру"</div>`);
  return `<div class="chat">${CHATS[chat]}</div>${composer()}`;
}
function modalL() {
  const x = TASKS.find(t => t.id === ST.modal) || ATASKS.find(t => t.id === ST.modal); if (!x) return '';
  const label = {q:'Очередь', run:'В работе', need:'Нужен ответ', acc:'Ждёт приёмки', done:'Готово'}[x.col];
  return `<div class="dim" data-close="1"><div class="big" data-stop="1">
    <div class="top"><span>${label}</span><span>·</span><span>ЭкоЭксперт</span><span class="sp"></span><span data-close="1" style="cursor:pointer;display:inline-flex">${ic('x')}</span></div>
    <h3>${x.t}</h3>
    <div class="fld"><div class="k">Сейчас</div><div class="v">${x.now}</div></div>
    ${x.need ? `<div class="fld"><div class="k">Вопрос к тебе</div><div class="v">${x.need}</div></div>
      <div class="reply"><input class="in" id="reply" placeholder="Ответить ${ST.reading==='A'?'исполнителю':'в чат'}..." style="outline:none;font:inherit;color:var(--fg)"><span class="btn pri" data-reply="${x.id}" style="cursor:pointer">${ic('send')}Отправить</span></div>` : ''}
    ${x.col==='acc' && !x.arch ? `<div class="fld"><div class="k">Проверено до тебя</div><div class="v"><ul style="margin:0;padding-left:18px">${x.checked.map(c=>`<li>${c}</li>`).join('')}</ul></div></div>
      <div class="reply"><input class="in" id="reply" placeholder="Что поправить (для возврата)..." style="outline:none;font:inherit;color:var(--fg)"><span class="btn" data-return="${x.id}" style="cursor:pointer">Вернуть</span><span class="btn pri" data-accept="${x.id}" style="cursor:pointer">Принять</span></div>` : ''}
    <div class="whobox">${pv(x.p||'claude','')}<div><div class="w1">${ST.reading==='A'?x.exec:'Чат '+x.chat}</div><div class="w2">${ST.reading==='A'?'исполнитель · из чата '+x.chat:'карточка ведётся в этом чате'}</div></div><span class="sp"></span><span class="btn" data-open="${x.chat}" style="cursor:pointer">${ic('open')}Открыть чат</span></div>
  </div></div>`;
}
ST.openSubs = []; ST.queue = {}; ST.msgs = {};
function subChatL(x) {
  const running = x.col === 'run';
  const q = ST.queue[x.id] || [];
  const msgs = ST.msgs[x.id] || [];
  const pills = [`<span class="pill3">${dot(x.col)}${STATUS[x.col]}</span>`];
  if (x.col === 'acc') pills.push(`<span class="pill3 ok" data-accept="${x.id}">Принять</span>`, `<span class="pill3 back" data-return="${x.id}">Вернуть</span>`);
  return `<div class="chat">
    <div class="subhead">${ic('corner')}Подагент чата <b style="color:var(--fg2);font-weight:500">${x.chat}</b> · исполнитель карточки · ${L[x.ep||'claude']}${x.ep==='codex'?'Codex':'Claude'}</div>
    <div class="me" style="max-width:720px">Задача от агента ${x.chat}: ${x.t.replace(/ - .*$/, '')}. План согласован с Александром в чате ${x.chat}, делай по нему и отчитывайся в карточку.</div>
    <div class="tool">${ic('brain')}Thinking</div>
    <div class="msg">${x.now}${x.need ? ' Вопрос к Александру: ' + x.need : ''}${x.col==='acc' ? ' Всё проверено, жду приёмки.' : ''}</div>
    ${msgs.map(m => m.me ? `<div class="me">${m.text}</div>` : `<div class="msg">${m.text}</div>`).join('')}
    ${running ? `<div class="tool"><span class="spin"></span>Работает...</div>` : `<div class="meta">${ic('copy')}${ic('branch')}<span>Время работы: 8m 12s</span></div>`}
  </div>
  <div class="pills">${pills.join('')}</div>
  ${q.map((text, i) => `<div class="qrow"><span class="tx">${text}</span><span class="qb" data-qedit="${x.id}:${i}" title="Изменить">${ic('pencil')}</span><span class="qb go" data-qsend="${x.id}:${i}" title="Отправить сейчас">${ic('send')}</span></div>`).join('')}
  <div class="composer"><input class="cin" id="subin" data-sub="${x.id}" placeholder="${running ? 'Напишите подагенту - Enter поставит сообщение в очередь' : 'Напишите подагенту сообщение'}">
    <div class="cbar">${ic('plus')}<span>${L[x.ep||'claude']}${x.ep==='codex'?'GPT-5.5':'Opus 5.5'} ${ic('down')}</span><span>${ic('brain')}Medium ${ic('down')}</span><span>${ic('shield')}Bypass ${ic('down')}</span><span class="sp"></span>${running ? `<span class="spin"></span>${ic('mic')}<span class="stopb" title="Остановить"><i></i></span>` : `${ic('mic')}<span class="sendb" data-subsend="${x.id}">${ic('send')}</span>`}</div></div>${limits()}`;
}
function subSend(id, text, now) {
  const x = TASKS.find(t => t.id === id); if (!x || !text) return;
  const running = x.col === 'run';
  if (running && !now) { (ST.queue[id] = ST.queue[id] || []).push(text); render(); return; }
  (ST.msgs[id] = ST.msgs[id] || []).push({ me: true, text });
  if (x.col === 'need') { x.col = 'run'; x.t = x.t.replace(/:.*$/, '') + ' - получил ответ, продолжает'; delete x.need; x.tm = 'сейчас'; x.u = 99; }
  render();
  setTimeout(() => { ST.msgs[id].push({ me: false, text: now && running ? 'Прервал текущий шаг и учёл твой комментарий, продолжаю.' : 'Принял, учту в работе.' }); render(); }, 700);
}
function render() {
  const sub = ST.view.startsWith('sub:') ? TASKS.find(t => t.id === +ST.view.slice(4)) : null;
  const main = ST.view === 'kan' ? `<div class="body">${boardL()}</div>` : sub ? `<div class="body"><div class="pane">${subChatL(sub)}</div>${ST.exp ? explorerL(sub.chat) : ''}</div>` : `<div class="body"><div class="pane">${chatL(ST.view)}</div>${ST.exp ? explorerL(ST.view) : ''}</div>`;
  document.getElementById('live').innerHTML = sidebarL() + `<main class="main">${topbarL()}${tabsL()}${main}${modalL()}</main>`;
  document.querySelectorAll('[data-rd]').forEach(b => b.classList.toggle('on', b.dataset.rd === ST.reading));
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-subsend],[data-qsend],[data-qedit],[data-group],[data-accept],[data-return],[data-go],[data-card],[data-grp],[data-arch],[data-archchat],[data-exp],[data-close],[data-reply],[data-open],[data-rd],[data-act],[data-menu],[data-sort],[data-order],[data-toggle],[data-stop]');
  if (!el) { if (ST.menu) { ST.menu = null; render(); } return; }
  const d = el.dataset;
  if (d.stop !== undefined && !e.target.closest('[data-close],[data-reply],[data-open],[data-accept],[data-return]')) return;
  if (d.menu) { const sub = ['groupBy','sortBy','order'].includes(d.menu); ST.menu = sub ? (ST.menu === d.menu ? 'sort' : d.menu) : ((ST.menu === d.menu || (d.menu === 'sort' && ST.menu && ST.menu !== 'view')) ? null : d.menu); render(); return; }
  if (d.subsend) { const inp = document.getElementById('subin'); subSend(+d.subsend, inp.value.trim(), false); return; }
  if (d.qsend) { const [id, i] = d.qsend.split(':').map(Number); const text = ST.queue[id].splice(i, 1)[0]; subSend(id, text, true); return; }
  if (d.qedit) { const [id, i] = d.qedit.split(':').map(Number); const text = ST.queue[id].splice(i, 1)[0]; render(); const inp = document.getElementById('subin'); inp.value = text; inp.focus(); return; }
  if (d.group) { ST.group = d.group; ST.menu = null; render(); return; }
  if (d.sort) { ST.sort = d.sort; ST.menu = null; render(); return; }
  if (d.order) { ST.order = d.order; ST.menu = null; render(); return; }
  if (d.toggle) { ST[d.toggle] = !ST[d.toggle]; render(); return; }
  ST.menu = null;
  if (d.accept) { const x = TASKS.find(t => t.id === +d.accept); x.col = 'done'; x.t = x.t.replace(/ - .*$/, '') + ' - принято'; x.now = 'Принято тобой.'; x.tm = 'сейчас'; x.u = 99; ST.modal = null; }
  else if (d.return) { const x = TASKS.find(t => t.id === +d.return); const v = (document.getElementById('reply')||document.getElementById('subin')||{}).value; x.col = 'run'; x.t = x.t.replace(/ - .*$/, '') + ' - возвращено: ' + (v || 'есть замечания'); x.now = 'Исполнитель правит по твоему замечанию.'; x.tm = 'сейчас'; x.u = 99; ST.modal = null; }
  else if (d.reply) { const x = TASKS.find(t => t.id === +d.reply); x.col = 'run'; x.t = x.t.replace(/:.*$/, '') + ' - получил ответ, продолжает'; delete x.need; x.now = 'Продолжает с твоим ответом.'; x.tm = 'сейчас'; x.u = 99; ST.modal = null; }
  else if (d.go) { ST.view = d.go; }
  else if (d.card) { const id = +d.card; if (ATASKS.some(t => t.id === id)) ST.modal = id; else { if (!ST.openSubs.includes(id)) ST.openSubs.push(id); ST.view = 'sub:' + id; } }
  else if (d.grp) { ST.collapsed[d.grp] = !ST.collapsed[d.grp]; }
  else if (d.arch) { ST.archOpen = !ST.archOpen; }
  else if (d.archchat) { ST.archChat = ST.archChat === d.archchat ? null : d.archchat; }
  else if (d.exp) { ST.exp = d.exp === 'close' ? false : !ST.exp; }
  else if (d.open) { ST.view = d.open; ST.modal = null; ST.exp = true; }
  else if (d.close) { ST.modal = null; }
  else if (d.rd) { ST.reading = d.rd; }
  else if (d.act === 'auto') {
    if (!ST.auto) TASKS.unshift({id:10, col:'run', t:'Срок подачи тендера в задачу менеджеру - изучает письма тендеров', chat:'Тендер', exec:'Срок подачи', c:20, u:100, tm:'сейчас', now:'Ищет, где в письме тендера срок подачи.'});
    ST.auto = true; ST.view = 'Тендер'; ST.exp = false; render();
    setTimeout(() => { ST.exp = true; render(); }, 700); return;
  }
  else if (d.act === 'reset') { resetTasks(); ST.openSubs = []; ST.queue = {}; ST.msgs = {}; Object.assign(ST, { view:'kan', exp:true, archOpen:false, archChat:null, modal:null, auto:false, group:'status', sort:'chat', order:'asc', hideDone:false, details:false, menu:null, collapsed:{}, manual:{} }); }
  render();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'subin') { subSend(+e.target.dataset.sub, e.target.value.trim(), false); } });
let dragId = null;
document.addEventListener('dragstart', (e) => { const c = e.target.closest('[data-card]'); if (!c) return; dragId = +c.dataset.card; c.classList.add('drag'); });
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.drag,.over').forEach(n => n.classList.remove('drag', 'over')); });
document.addEventListener('dragover', (e) => { const c = e.target.closest('[data-card]'); if (!c || dragId === null) return; const src = TASKS.find(t => t.id === dragId); if (c.dataset.col !== src.col) return; e.preventDefault(); document.querySelectorAll('.over').forEach(n => n.classList.remove('over')); c.classList.add('over'); });
document.addEventListener('drop', (e) => {
  const c = e.target.closest('[data-card]'); if (!c || dragId === null) return; e.preventDefault();
  const src = TASKS.find(t => t.id === dragId); if (c.dataset.col !== src.col) return;
  const col = src.col; const cur = (ST.manual[col] && ST.manual[col].length) ? ST.manual[col].filter(id => TASKS.some(t => t.id === id && t.col === col)) : [...document.querySelectorAll(`[data-card][data-col="${col}"]`)].map(n => +n.dataset.card);
  TASKS.filter(t => t.col === col && !cur.includes(t.id)).forEach(t => cur.push(t.id));
  const from = cur.indexOf(dragId); cur.splice(from, 1); cur.splice(cur.indexOf(+c.dataset.card), 0, dragId);
  ST.manual[col] = cur; ST.sort = 'manual'; dragId = null; render();
});
render();

</script>
</body>
</html>
